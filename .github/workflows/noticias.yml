# Esta es la "alarma" que despierta al bot cada 15 minutos.
name: Noticias de Minecraft

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos (GitHub a veces se retrasa unos minutos)
  workflow_dispatch:          # permite ejecutarlo a mano con el botón "Run workflow"

permissions:
  contents: write             # para poder guardar estado.json (la memoria del bot)

concurrency:
  group: noticias-minecraft   # evita que se ejecuten dos revisiones al mismo tiempo
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el bot
        uses: actions/checkout@v4

      - name: Revisar noticias y publicar en Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 bot.py

      - name: Guardar la memoria del bot
        if: always()
        run: |
          if [ -f estado.json ] && [ -n "$(git status --porcelain estado.json)" ]; then
            git config user.name "bot-noticias"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add estado.json
            git commit -m "Actualizar noticias publicadas"
            git push
          else
            echo "Sin cambios que guardar."
          fi
